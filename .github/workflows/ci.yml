name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - grid-query-hardening
      - owner-lifecycle-hardening

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: grid
          POSTGRES_DB: grid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://grid:grid@localhost:5432/grid
      TEST_DATABASE_URL: postgresql://grid:grid@localhost:5432/grid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zenstack-generate
      - run: git diff --exit-code
      - run: pnpm prisma db push --skip-generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
